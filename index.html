<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AIにらめっこ</title>
		<!-- Tailwind  -->
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
		<style>
			body { font-family: 'Fredoka', 'Noto Sans JP', sans-serif; }
			.pop-anim { animation: pop 0.3s cubic-bezier(.4,2,.6,1) both; }
			@keyframes pop { 0% { transform: scale(1); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
		</style>
	</head>
	<body class="min-h-screen flex flex-col items-center justify-start p-6 gap-4 bg-gradient-to-br from-pink-100 via-yellow-50 to-sky-100">
		<header class="text-center mt-2">
			<h1 class="text-4xl md:text-5xl font-extrabold text-pink-500 drop-shadow-lg tracking-tight mb-2">笑ったら負けの表情バトル</h1>
			<p class="text-pink-500 font-bold text-lg md:text-xl">cpuとにらめっこ！笑顔を我慢できる？</p>
		</header>

				<main class="w-full flex flex-col items-center gap-6">
					<!-- 左：ユーザー（動画）／右：CPU（絵文字） -->
					<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch h-[340px] md:h-[440px] relative">
						<!-- ユーザー側 -->
						<div class="grid grid-rows-[1fr_auto] h-full min-h-0">
							<div class="relative w-full h-full rounded-3xl border-4 border-pink-300 shadow-xl overflow-hidden bg-white/90 ring-2 ring-pink-200">
								<span class="absolute top-2 left-2 px-3 py-1 rounded-full text-base bg-pink-200 text-pink-700 border border-pink-300 font-bold shadow">YOU</span>
								<video id="video" class="w-full h-full object-cover bg-pink-50" autoplay muted playsinline style="border-radius: 1.5rem;"></video>
							</div>
							<p id="userState" class="mt-3 text-center text-lg font-bold text-pink-600 drop-shadow">スタートボタンを押して対戦開始</p>
						</div>

						<!-- CPU側 -->
						<div class="grid grid-rows-[1fr_auto_auto] h-full min-h-0">
							<div class="relative rounded-3xl border-4 border-sky-300 shadow-xl flex items-center justify-center overflow-hidden h-full bg-white/90 ring-2 ring-sky-200">
								<span class="absolute top-2 right-2 px-3 py-1 rounded-full text-base bg-sky-200 text-sky-700 border border-sky-300 font-bold shadow">CPU</span>
								<div class="flex flex-col items-center w-full">
									<div id="cpuJoke" class="min-h-[1.5em] text-center text-xs md:text-base text-gray-500 font-bold mb-1"></div>
									<div id="cpuFaceEmoji" class="text-7xl md:text-9xl text-center transition-all duration-300">😐</div>
								</div>
							</div>
							<p id="cpuFaceLabel" class="text-center text-base font-bold text-sky-500 mt-1">真顔</p>
							<p id="cpuState" class="mt-1 text-center text-sky-700 font-semibold">😐 真顔キープ中</p>
						</div>

						<!-- VS バッジ -->
						<div class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full bg-white border-4 border-pink-300 shadow-2xl items-center justify-center text-pink-500 font-extrabold text-3xl ring-2 ring-pink-200">VS</div>
					</div>

					<!-- 操作用ボタン -->
					<div class="flex gap-4 mt-2">
						<button id="startBtn" class="px-6 py-2 bg-pink-500 text-white font-bold rounded-full shadow text-lg border-2 border-pink-300">スタート</button>
						<button id="resetBtn" class="px-6 py-2 bg-gray-300 text-gray-700 font-bold rounded-full shadow text-lg border-2 border-gray-300">もう一度</button>
					</div>
										<div class="mt-2 w-full max-w-md flex flex-col items-center">
												<label id="difficultyLabel" for="difficulty" class="block text-base mb-1 font-bold text-pink-700">難易度: 普通</label>
												<input id="difficulty" type="range" min="1" max="3" step="1" value="2" class="w-full accent-pink-400 h-2 rounded-lg appearance-none bg-gradient-to-r from-pink-200 via-yellow-100 to-sky-200 shadow-inner" />
												<div class="mt-1 text-sm text-gray-500 font-semibold flex justify-between w-full px-1">
													<span>1=簡単</span><span>2=普通</span><span>3=難しい</span>
												</div>
										</div>

					<!-- 結果（勝敗時のみ表示） -->
					<p id="result" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-5xl md:text-7xl font-extrabold italic tracking-wide uppercase opacity-0 transition-opacity duration-500 pointer-events-none rounded-3xl border-4 bg-white/90 px-8 py-5 shadow-2xl text-pink-500 z-50">-</p>
				</main>


			<script type="module" src="js/main.js"></script>
	</body>
	</html>
